# Quantumult X 重写与脚本配置

[rewrite_local]
# ==========================================
# Header Rewrites (移除 RevenueCat 的 ETag)
# ==========================================
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/?(.*?)*$) url request-header X-RevenueCat-ETag:.+ request-header 
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/?(.*?)*$) url request-header x-revenuecat-etag:.+ request-header 

# ==========================================
# Scriptings (JS 脚本注入)
# ==========================================
# AppRCTesters
^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/[^/]+$) url script-response-body https://apptesters.org/egern/AutoRC.js

# AppAdTesters
