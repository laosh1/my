mitm:
  enabled: true
  ca_p12: 'egern.p12'
  ca_passphrase: 'egern'
  hostnames:
    - api.revenuecat.com
    - buy.itunes.apple.com
    - api.picsart.com
    - api-account.kinemasters.com
    - us-central1-alight-creative.cloudfunctions.net
    - api.adapty.io
    - carrotweather.herokuapp.com
    - order.creativeappnow.com
    - api.mwm-users.com
    - us-central1-muslim-pro-app.cloudfunctions.net
    - prod.studysmarter.de
    - api.qonversion.io
    - subscription.grammarly.com
    - api.esound.app
    - api.purchasely.io
    - api.sandbox.love
    - subscriptions.songshift.com
    - api.adblockpro.app
    - mobile-api.adguard.org
  header_rewrites:
    - type: request
      match: '^https?://api.revenuecat.com/.+/(receipts$|subscribers/?(.*?)*$)'
      name: X-RevenueCat-ETag
      delete: true
    - type: request
      match: '^https?://api.revenuecat.com/.+/(receipts$|subscribers/?(.*?)*$)'
      name: x-revenuecat-etag
      delete: true
  scriptings:
    http_response:
      - name: AppRCTesters
        match: '^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/[^/]+$)'
        script_url: 'https://apptesters.org/egern/AutoRC.js'
        body_required: true
        update_interval: 5
      - name: AppAdTesters
        match: 'https://api.adapty.io/api/v1/sdk/analytics/profiles'
        script_url: 'https://apptesters.org/egern/Adapty.js'
        body_required: true
        update_interval: 5
      - name: AppFMTesters
        match: 'https://order.creativeappnow.com/iap/receipt'
        script_url: 'https://apptesters.org/egern/Facemoji.js'
        body_required: true
        update_interval: 5
      - name: AppReTesters
        match: 'https:\/\/license\.pdfexpert\.com\/api\/2\.0\/(calendarslite|pdfexpert6|documents)\/subscription\/(refresh|check)'
        script_url: 'https://apptesters.org/egern/readdle.js'
        body_required: true
        update_interval: 5
      - name: AppitTesters
        match: '^https:\/\/buy\.itunes\.apple\.com\/verifyReceipt'
        script_url: 'https://apptesters.org/egern/iTunes.js'
        body_required: true
        update_interval: 5
      - name: AppMuTesters
        match: 'us-central1-muslim-pro-app.cloudfunctions.net/GetUserPremiumInfo'
        script_url: 'https://apptesters.org/egern/MuslimPro.js'
        body_required: true
        update_interval: 5
      - name: AppGrTesters
        match: '^https?:\/\/subscription\.grammarly\.com\/api\/v1\/subscription$'
        script_url: 'https://apptesters.org/egern/Grammarly.js'
        body_required: true
        update_interval: 5
      - name: AppeSTesters
        match: 'api.esound.app/account'
        script_url: 'https://apptesters.org/egern/eSound.js'
        body_required: true
        update_interval: 5
      - name: AppPurTesters
        match: 'https://api.purchasely.io/paab/user_purchases'
        script_url: 'https://apptesters.org/egern/purchasely.js'
        body_required: true
        update_interval: 5
      - name: AppVaTesters
        match: 'prod.studysmarter.de/payments/info'
        script_url: 'https://apptesters.org/egern/Vaia.js'
        body_required: true
        update_interval: 5
      - name: AppQOTesters
        match: 'api.qonversion.io/v1/user/init'
        script_url: 'https://apptesters.org/egern/qonversion.js'
        body_required: true
        update_interval: 5
      - name: AppDJTesters
        match: 'https://api.mwm-users.com/me/features'
        script_url: 'https://apptesters.org/egern/edjingMix.js'
        body_required: true
        update_interval: 5
      - name: AppVCTesters
        match: 'https://api-fra.vivacut.com/api/rest/commerce/integrate/vip/perform'
        script_url: 'https://apptesters.org/egern/VivaCut.js'
        body_required: true
        update_interval: 5
      - name: AppCaTesters
        match: 'https://carrotweather.herokuapp.com/parse/functions/findSubscriptionsForUserId'
        script_url: 'https://apptesters.org/egern/Carrot.js'
        body_required: true
        update_interval: 5
      - name: AppKineTesters
        match: 'https://api-account.kinemasters.com/v2/user/subscribe'
        script_url: 'https://apptesters.org/egern/KineMaster.js'
        body_required: true
        update_interval: 5
      - name: AppAMTesters
        match: 'https://us-central1-alight-creative.cloudfunctions.net/getAccountStatusAndLicenses'
        script_url: 'https://apptesters.org/egern/AlightMotion.js'
        body_required: true
        update_interval: 5
      - name: AppSaTesters
        match: 'api.sandbox.love/accounts/current'
        script_url: 'https://apptesters.org/egern/SandBox.js'
        body_required: true
        update_interval: 5
      - name: AppSSesters
        match: 'subscriptions.songshift.com/validate'
        script_url: 'https://apptesters.org/egern/SongShift.js'
        body_required: true
        update_interval: 5
      - name: AppADBTesters
        match: 'api.adblockpro.app/verify'
        script_url: 'https://apptesters.org/egern/AdblockPro.js'
        body_required: true
        update_interval: 5
      - name: AppADGTesters
        match: '^https:\/\/mobile-api\.adguard\.org\/api\/.+\/ios_validate_receipt\/(.*?)'
        script_url: 'https://apptesters.org/egern/AdGuardPro.js'
        body_required: true
        update_interval: 5
      - name: AppDTesters
        match: 'ILoveDevTheDev.com'
        script_url: 'https://URL2Script.com'
        body_required: true
        update_interval: 5
      - name: AppDTesters
        match: 'ILoveDevTheDev.com'
        script_url: 'https://URL2Script.com'
        body_required: true
        update_interval: 5
      - name: AppDTesters
        match: 'ILoveDevTheDev.com'
        script_url: 'https://URL2Script.com'
        body_required: true
        update_interval: 5
    http_request:
      - name: AppPicTesters
        match: 'https://api.picsart.com/gw-v2/shop/subscription/apple/purchases'
        script_url: 'https://apptesters.org/egern/PicsArt.js'
        body_required: true
        update_interval: 5
